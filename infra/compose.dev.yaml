services:
  postgres:
    image: postgres:18-alpine
    container_name: vesperaflow-postgres
    environment:
      POSTGRES_USER: vespera
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vespera
    ports:
      - "15432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d
    networks:
      - temporal_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vespera -d vespera" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: temporal-admin-tools
    restart: on-failure:6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - SQL_PASSWORD=temporal
    networks:
      - temporal_network
    volumes:
      - ./scripts:/scripts
    entrypoint: [ "/bin/sh" ]
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION}
    container_name: temporal
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    networks:
      - temporal_network
    ports:
      - '17233:7233'
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "7233" ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: temporal-create-namespace
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    networks:
      - temporal_network
    volumes:
      - ./scripts:/scripts
    entrypoint: [ "/bin/sh" ]
    command: /scripts/create-namespace.sh

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CSRF_COOKIE_INSECURE=true
      - TEMPORAL_CORS_ORIGINS=http://localhost:18080,http://192.168.71.10:18080
    networks:
      - temporal_network
    ports:
      - 18080:8080

networks:
  temporal_network:
    driver: bridge
    name: vespera_temporal_network
