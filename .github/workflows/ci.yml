name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  repo-health:
    name: Agent repo health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/check_agent_repo.py

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --all-packages --dev
      - run: uv run ruff check .
      - run: uv run basedpyright
      - run: uv run pytest
      - run: uv run python scripts/generate_agent_facts.py
        env:
          VESPERAFLOW_DATABASE_URL: postgresql://localhost/dummy
      - run: git diff --exit-code docs/generated

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      - run: bun run format
      - run: bun run test:unit:run
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e:smoke
