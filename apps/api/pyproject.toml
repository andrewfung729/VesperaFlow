[project]
name = "vesperaflow-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andrewfung729", email = "official@waiki.me" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.124.0",
    "pydantic-settings>=2.12.0",
    "temporalio>=1.19.0",
    "uvicorn[standard]>=0.38.0",
    "vesperaflow-core",
    "vesperaflow-store",
]

[project.scripts]
vesperaflow-api = "vesperaflow_api.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
