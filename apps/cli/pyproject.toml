[project]
name = "vesperaflow-cli"
version = "0.2.0"
description = "Agent-friendly command line client for VesperaFlow."
readme = "README.md"
authors = [{ name = "andrewfung729", email = "official@waiki.me" }]
requires-python = ">=3.13"
dependencies = ["httpx>=0.28.1", "pydantic>=2.13", "vesperaflow-core"]

[project.scripts]
vespera = "vesperaflow_cli.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
