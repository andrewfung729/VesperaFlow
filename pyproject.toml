[project]
name = "vesperaflow"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/core",
    "packages/store",
]

[tool.uv.sources]
vesperaflow-core = { workspace = true }
vesperaflow-store = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "packages/store/tests",
    "apps/api/tests",
    "apps/worker/tests",
    "tests/integration",
]
pythonpath = [
    "packages/core/src",
    "packages/store/src",
    "apps/api/src",
    "apps/worker/src",
]
markers = [
    "integration: tests that require external services such as Postgres or Temporal",
]
