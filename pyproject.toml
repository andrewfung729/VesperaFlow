[project]
name = "vesperaflow"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "vesperaflow-api",
    "vesperaflow-core",
    "vesperaflow-store",
    "vesperaflow-worker",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core", "packages/store"]

[tool.uv.sources]
vesperaflow-api = { workspace = true }
vesperaflow-core = { workspace = true }
vesperaflow-store = { workspace = true }
vesperaflow-worker = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "packages/store/tests",
    "apps/api/tests",
    "apps/worker/tests",
    "tests/integration",
]
pythonpath = [
    "packages/core/src",
    "packages/store/src",
    "apps/api/src",
    "apps/worker/src",
]
markers = [
    "integration: tests that require external services such as Postgres or Temporal",
]

[tool.ruff]
target-version = "py313" # 對應 Python 3.13
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort (import 排序)
    "W",  # pycodestyle warnings
    "UP", # pyupgrade
]

[tool.ruff.lint.pydocstyle]
convention = "google"
